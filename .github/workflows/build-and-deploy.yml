name: build-and-deploy

# Constrói a imagem do frontend e a empurra para o ECR. Não faz deploy: no
# desenho de Lightsail o deploy é `deploy/deploy.sh` no repo devops, rodado da
# máquina do Nickolas. O `repository_dispatch` que existia aqui saiu — não há
# mais nada para acordar.
#
# O Dockerfile não muda: a imagem nginx com o `proxy_pass ${API_URL}` continua
# exatamente como está (decisão 6 da spec).
#
# Manual por enquanto, de propósito: nada na AWS foi aplicado ainda (Task 0 em
# diante do plano do piloto), então um gatilho em push só produziria falha
# vermelha a cada commit. Quando o ECR existir e os secrets estiverem postos,
# troque por:
#
#   on:
#     push:
#       branches: [main]
#
# Secrets necessários: AWS_DEPLOY_ROLE_ARN e ECR_REGISTRY, ambos vindos de
# `terraform output` no repo devops (Task 10, Passo 1).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: sa-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          IMAGE="${{ secrets.ECR_REGISTRY }}/prumo-web"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
