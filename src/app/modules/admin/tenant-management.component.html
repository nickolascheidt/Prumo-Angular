<div class="tenant-mgmt">
  <section class="page-header">
    <div class="page-header__icon"><mat-icon>business</mat-icon></div>
    <div>
      <h1>Gerenciar Tenant</h1>
      <p *ngIf="tenant">{{ tenant.name }} <small>({{ tenant.slug }})</small></p>
      <p *ngIf="!tenant">Carregando...</p>
    </div>
  </section>

  <mat-tab-group>
    <mat-tab label="Membros">
      <mat-card>
        <div *ngIf="membersLoading" class="loading"><mat-spinner diameter="32"></mat-spinner></div>
        <table *ngIf="!membersLoading" mat-table [dataSource]="members" class="full-table">
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let m">{{ m.email }}</td>
          </ng-container>
          <ng-container matColumnDef="fullName">
            <th mat-header-cell *matHeaderCellDef>Nome</th>
            <td mat-cell *matCellDef="let m">{{ m.fullName || '—' }}</td>
          </ng-container>
          <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef>Role</th>
            <td mat-cell *matCellDef="let m">{{ roleLabel(m.role) }}</td>
          </ng-container>
          <ng-container matColumnDef="joinedAt">
            <th mat-header-cell *matHeaderCellDef>Entrou em</th>
            <td mat-cell *matCellDef="let m">{{ m.joinedAt | date:'short' }}</td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="memberColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: memberColumns"></tr>
        </table>
        <p *ngIf="!membersLoading && !members.length" class="empty">Nenhum membro.</p>
      </mat-card>
    </mat-tab>
  </mat-tab-group>
</div>
