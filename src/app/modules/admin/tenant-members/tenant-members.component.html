<div class="page-container">
  <div class="page-header">
    <div>
      <h1>Membros do Tenant</h1>
    </div>
    <button mat-flat-button color="primary" (click)="openAddDialog()">
      <mat-icon>person_add</mat-icon> Adicionar Membro
    </button>
  </div>

  @if (loading) {
    <div class="loading-container">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  }

  @if (!loading) {
    <table mat-table [dataSource]="members" class="mat-elevation-z2 full-width">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let m">{{ m.fullName || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>E-mail</th>
        <td mat-cell *matCellDef="let m">{{ m.email }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Papel</th>
        <td mat-cell *matCellDef="let m">
          <mat-chip>{{ roleLabel(m.role) }}</mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="joinedAt">
        <th mat-header-cell *matHeaderCellDef>Entrou em</th>
        <td mat-cell *matCellDef="let m">{{ m.joinedAt | date:'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let m">
          @if (canManage(m)) {
            <button mat-icon-button matTooltip="Alterar papel" (click)="openChangeRoleDialog(m)">
              <mat-icon>manage_accounts</mat-icon>
            </button>
            <button mat-icon-button matTooltip="Remover membro" color="warn" (click)="removeMember(m)">
              <mat-icon>person_remove</mat-icon>
            </button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="5" style="text-align:center;padding:32px">
          Nenhum membro encontrado.
        </td>
      </tr>
    </table>
  }
</div>

<style>
  .page-container { padding: 24px; }
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .full-width { width: 100%; }
  .loading-container { display: flex; justify-content: center; padding: 64px; }
</style>
