<app-auth-shell title="Waiting for an invitation" subtitle="Your account is ready" icon="hourglass_top">
  <div class="auth-status">
    <mat-icon>group_add</mat-icon>
    <p class="auth-note">
      Your account<ng-container *ngIf="email">&nbsp;(<strong>{{ email }}</strong>)</ng-container>
      is not part of any company yet.
    </p>
    <p class="auth-note">
      Ask an administrator to add <strong>this same e-mail</strong>. As soon as they do,
      just sign in again — the company shows up on its own.
    </p>
  </div>

  <button mat-stroked-button class="auth-btn auth-btn--block" (click)="signOut()">
    Sign out
  </button>
</app-auth-shell>
