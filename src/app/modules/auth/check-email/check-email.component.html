<app-auth-shell title="Confirm your e-mail" subtitle="One step left" icon="mark_email_unread">
  <div class="auth-status">
    <mat-icon>outgoing_mail</mat-icon>
    <p class="auth-note">
      We sent a confirmation link<ng-container *ngIf="email">&nbsp;to <strong>{{ email }}</strong></ng-container>.
      Open the link to activate your account.
    </p>
  </div>

  <button
    mat-stroked-button
    class="auth-btn auth-btn--block"
    [disabled]="isResending || !email"
    (click)="resend()">
    Resend e-mail
  </button>

  <div class="auth-links">
    <a routerLink="/auth/login">Back to sign in</a>
  </div>
</app-auth-shell>
