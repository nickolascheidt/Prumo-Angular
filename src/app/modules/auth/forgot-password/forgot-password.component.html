<app-auth-shell title="Esqueci minha senha" subtitle="Enviamos um link para você" icon="lock_reset">
  <ng-container *ngIf="!sent; else done">
    <p class="auth-note">
      Informe o e-mail da sua conta. Se ela existir, você receberá um link para criar uma
      nova senha.
    </p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>mail_outline</mat-icon>
        <input matInput formControlName="email" type="email" autocomplete="email">
        <mat-error>Email inválido</mat-error>
      </mat-form-field>

      <button
        mat-flat-button
        color="primary"
        class="auth-btn"
        [disabled]="isLoading || form.invalid">
        <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
        <span *ngIf="!isLoading">Enviar link</span>
      </button>
    </form>
  </ng-container>

  <ng-template #done>
    <div class="auth-status auth-status--ok">
      <mat-icon>mark_email_read</mat-icon>
      <p class="auth-note">
        Se houver uma conta com esse e-mail, o link já está a caminho. Ele vale por tempo
        limitado e só pode ser usado uma vez.
      </p>
    </div>
  </ng-template>

  <div class="auth-links">
    <a routerLink="/auth/login">Voltar para o login</a>
  </div>
</app-auth-shell>
