<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>
        <h1>BiomePampa ERP</h1>
        <p>Sistema de Gestão de Funcionários</p>
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="seu@email.com">
          <mat-error>Email inválido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha</mat-label>
          <input matInput formControlName="password" type="password" placeholder="Sua senha">
          <mat-error>Senha obrigatória (mínimo 6 caracteres)</mat-error>
        </mat-form-field>

        <button 
          mat-raised-button 
          color="primary" 
          class="full-width login-btn"
          [disabled]="isLoading || loginForm.invalid"
        >
          <mat-spinner *ngIf="isLoading" diameter="20" color="accent"></mat-spinner>
          <span *ngIf="!isLoading">Entrar</span>
        </button>
      </form>

    </mat-card-content>
  </mat-card>
</div>
