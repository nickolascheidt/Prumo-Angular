<app-auth-shell>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <mat-icon matPrefix>mail_outline</mat-icon>
      <input matInput formControlName="email" type="email" placeholder="you@example.com" autocomplete="email">
      <mat-error>Invalid e-mail</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <mat-icon matPrefix>lock_outline</mat-icon>
      <input matInput formControlName="password" type="password" placeholder="Your password" autocomplete="current-password">
      <mat-error>Password required (at least 6 characters)</mat-error>
    </mat-form-field>

    <button
      mat-flat-button
      color="primary"
      class="auth-btn"
      [disabled]="isLoading || loginForm.invalid">
      <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
      <span *ngIf="!isLoading">Sign in</span>
    </button>
  </form>

  <div class="auth-links">
    <a routerLink="/auth/register">Create account</a>
    <a routerLink="/auth/forgot-password">Forgot my password</a>
  </div>
</app-auth-shell>
