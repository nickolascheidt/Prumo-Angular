<app-auth-shell title="Criar conta" subtitle="Leva menos de um minuto" icon="person_add">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
    <mat-form-field appearance="outline">
      <mat-label>Nome completo</mat-label>
      <mat-icon matPrefix>badge</mat-icon>
      <input matInput formControlName="fullName" autocomplete="name">
      <mat-error>Informe seu nome (mínimo 3 caracteres)</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <mat-icon matPrefix>mail_outline</mat-icon>
      <input matInput formControlName="email" type="email" placeholder="seu@email.com" autocomplete="email">
      <mat-error>Email inválido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Senha</mat-label>
      <mat-icon matPrefix>lock_outline</mat-icon>
      <input matInput formControlName="password" type="password" autocomplete="new-password">
      <mat-error>Mínimo de 6 caracteres</mat-error>
    </mat-form-field>

    <button
      mat-flat-button
      color="primary"
      class="auth-btn"
      [disabled]="isLoading || form.invalid">
      <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
      <span *ngIf="!isLoading">Criar conta</span>
    </button>
  </form>

  <div class="auth-links">
    <a routerLink="/auth/login">Já tenho conta</a>
  </div>
</app-auth-shell>
