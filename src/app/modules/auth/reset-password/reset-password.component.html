<app-auth-shell title="Nova senha" subtitle="Escolha uma senha para sua conta" icon="password">
  <div class="auth-status auth-status--error" *ngIf="linkIsBroken; else formTemplate">
    <mat-icon>error_outline</mat-icon>
    <p class="auth-note">
      Este link está incompleto. Peça um novo em "Esqueci minha senha".
    </p>
    <a mat-stroked-button class="auth-btn auth-btn--block" routerLink="/auth/forgot-password">
      Pedir novo link
    </a>
  </div>

  <ng-template #formTemplate>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <mat-form-field appearance="outline">
        <mat-label>Nova senha</mat-label>
        <mat-icon matPrefix>lock_outline</mat-icon>
        <input matInput formControlName="password" type="password" autocomplete="new-password">
        <mat-error>Mínimo de 6 caracteres</mat-error>
      </mat-form-field>

      <button
        mat-flat-button
        color="primary"
        class="auth-btn"
        [disabled]="isLoading || form.invalid">
        <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
        <span *ngIf="!isLoading">Salvar senha</span>
      </button>
    </form>
  </ng-template>

  <div class="auth-links">
    <a routerLink="/auth/login">Voltar para o login</a>
  </div>
</app-auth-shell>
