<div class="tenant-page">
  <mat-card class="tenant-card">
    <div class="tenant-card__brand">
      <mat-icon>business</mat-icon>
      <h1>Select a tenant</h1>
      <p>Choose a tenant to continue.</p>
    </div>

    <div *ngIf="isLoading" class="loading">
      <mat-spinner diameter="36"></mat-spinner>
    </div>

    <!-- A plain list instead of mat-list: mat-list-item nests the content in two wrappers
         of its own (__content > __primary-text) the component styles cannot reach, and
         the button ended up stacked under the tenant name. -->
    <div class="tenant-list" *ngIf="!isLoading && memberships.length">
      <div class="tenant-item" *ngFor="let m of memberships">
        <div class="tenant-item__info">
          <strong>{{ m.tenantName }}</strong>
          <small>{{ m.tenantSlug }} · {{ roleLabel(m.role) }}</small>
        </div>
        <button mat-flat-button color="primary"
                [disabled]="isSelecting"
                (click)="select(m.tenantId)">
          Enter
        </button>
      </div>
    </div>

    <p *ngIf="!isLoading && !memberships.length" class="empty-msg">
      Your account has no access to any tenant. Contact an administrator.
    </p>

    <mat-divider></mat-divider>

    <button mat-button class="logout-btn" (click)="logout()">
      <mat-icon>logout</mat-icon> Sign out
    </button>
  </mat-card>
</div>
