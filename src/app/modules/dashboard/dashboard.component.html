<div class="dashboard-container">
  <ng-container *ngIf="currentUser$ | async as user">
    <h1>Bem-vindo, {{ user.fullName }}</h1>
    <p class="subtitle">{{ user.email }}</p>

    <div class="cards-grid">
      <mat-card class="info-card">
        <mat-card-header>
          <mat-icon mat-card-avatar>badge</mat-icon>
          <mat-card-title>Suas Roles</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <ul class="roles-list">
            <li *ngFor="let role of user.roles">{{ role }}</li>
            <li *ngIf="!user.roles?.length" class="empty">Nenhuma role atribuída</li>
          </ul>
        </mat-card-content>
      </mat-card>

      <mat-card class="info-card" *ngIf="user.roles?.includes('Administrador')">
        <mat-card-header>
          <mat-icon mat-card-avatar>admin_panel_settings</mat-icon>
          <mat-card-title>Administração</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>Acesse o painel para gerenciar usuários, roles, permissões e recursos.</p>
          <a mat-stroked-button color="primary" routerLink="/admin">Abrir Painel Admin</a>
        </mat-card-content>
      </mat-card>
    </div>
  </ng-container>
</div>
