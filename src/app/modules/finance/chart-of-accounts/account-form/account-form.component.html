<h2 mat-dialog-title>{{ isEdit ? 'Edit account' : 'New account' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="account-form">
    <mat-form-field appearance="outline" style="width:100%">
      <mat-label>Code</mat-label>
      <input matInput formControlName="code" placeholder="e.g. 1.1.3">
      <mat-error *ngIf="form.get('code')?.hasError('required')">Code is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" style="width:100%">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name">
      <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" style="width:100%">
      <mat-label>Type</mat-label>
      <mat-select formControlName="type">
        <mat-option *ngFor="let t of accountTypes" [value]="t.value">{{ t.label }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" style="width:100%">
      <mat-label>Parent account (optional)</mat-label>
      <mat-select formControlName="parentId">
        <mat-option [value]="null">— None (root) —</mat-option>
        <mat-option *ngFor="let a of syntheticAccounts" [value]="a.id">
          {{ a.code }} – {{ a.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <div style="display:flex; gap:24px; padding:8px 0">
      <mat-slide-toggle formControlName="isAnalytic">Analytic account</mat-slide-toggle>
      <mat-slide-toggle formControlName="isActive" *ngIf="isEdit">Active</mat-slide-toggle>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="saving">
    <mat-spinner *ngIf="saving" diameter="18" style="display:inline-block;margin-right:8px"></mat-spinner>
    Save
  </button>
</mat-dialog-actions>
