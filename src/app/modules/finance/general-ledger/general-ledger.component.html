<div class="general-ledger">
  <section class="page-header">
    <div class="page-header__icon"><mat-icon>menu_book</mat-icon></div>
    <div class="page-header__text">
      <h1>General Ledger</h1>
      <p>Journal entries and account statements.</p>
    </div>
    <span class="spacer"></span>
    <button mat-stroked-button (click)="openStatement()">
      <mat-icon>receipt_long</mat-icon> Account statement
    </button>
    <button mat-flat-button color="primary" *ngIf="canCreate" (click)="openCreate()">
      <mat-icon>add</mat-icon> Manual entry
    </button>
  </section>

  <mat-card class="filters-card">
    <form [formGroup]="filtersForm" class="filters">
      <mat-form-field appearance="outline">
        <mat-label>From</mat-label>
        <input matInput [matDatepicker]="fromPicker" formControlName="from">
        <mat-datepicker-toggle matIconSuffix [for]="fromPicker"></mat-datepicker-toggle>
        <mat-datepicker #fromPicker></mat-datepicker>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>To</mat-label>
        <input matInput [matDatepicker]="toPicker" formControlName="to">
        <mat-datepicker-toggle matIconSuffix [for]="toPicker"></mat-datepicker-toggle>
        <mat-datepicker #toPicker></mat-datepicker>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Module</mat-label>
        <mat-select formControlName="sourceModule">
          <mat-option *ngFor="let s of sourceModules" [value]="s.value">{{ s.label }}</mat-option>
        </mat-select>
      </mat-form-field>
    </form>
  </mat-card>

  <mat-card>
    <mat-progress-spinner *ngIf="loading" mode="indeterminate" diameter="40" style="margin:24px auto"></mat-progress-spinner>

    <table mat-table [dataSource]="entries" *ngIf="!loading">
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let e" class="num">{{ e.date | date:'mediumDate' }}</td>
      </ng-container>
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let e">{{ e.description }}</td>
      </ng-container>
      <ng-container matColumnDef="source">
        <th mat-header-cell *matHeaderCellDef>Source</th>
        <td mat-cell *matCellDef="let e">
          <mat-chip-set><mat-chip>{{ sourceLabel(e.sourceModule) }}</mat-chip></mat-chip-set>
        </td>
      </ng-container>
      <ng-container matColumnDef="totalAmount">
        <th mat-header-cell *matHeaderCellDef class="num--value">Total</th>
        <td mat-cell *matCellDef="let e" class="num num--value">{{ e.totalAmount | currency:'BRL' }}</td>
      </ng-container>
      <ng-container matColumnDef="lineCount">
        <th mat-header-cell *matHeaderCellDef>Lines</th>
        <td mat-cell *matCellDef="let e" class="num">{{ e.lineCount }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let e">
          <button mat-icon-button (click)="$event.stopPropagation(); openDetail(e)"><mat-icon>visibility</mat-icon></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" style="cursor:pointer" (click)="openDetail(row)"></tr>
    </table>

    <mat-paginator
      [length]="total"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      [pageIndex]="pageIndex"
      (page)="onPage($event)">
    </mat-paginator>
  </mat-card>
</div>
