<mat-toolbar color="primary" class="app-toolbar">
  <button mat-icon-button (click)="toggleSidenav()" class="sidenav-toggle">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="app-title">BiomePampa ERP</span>
  <span class="spacer"></span>
  <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-menu-btn">
    <mat-icon>person</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu">
    <button mat-menu-item>
      <mat-icon>settings</mat-icon>
      <span>Configurações</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Sair</span>
    </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav 
    #sidenav 
    [opened]="sidenavOpened" 
    [mode]="isMobile ? 'over' : 'side'" 
    class="app-sidenav"
    (openedChange)="sidenavOpened = $event">
    <mat-nav-list>
      <h2 matSubheader>Menu Principal</h2>
      <mat-list-item 
        routerLink="/dashboard" 
        routerLinkActive="active"
        (click)="onNavItemClick()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </mat-list-item>

      <mat-list-item 
        routerLink="/employees" 
        routerLinkActive="active"
        (click)="onNavItemClick()">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Funcionários</span>
      </mat-list-item>

      <mat-list-item 
        routerLink="/worklogs" 
        routerLinkActive="active"
        (click)="onNavItemClick()">
        <mat-icon matListItemIcon>schedule</mat-icon>
        <span matListItemTitle>Horas Trabalhadas</span>
      </mat-list-item>

      <mat-list-item 
        routerLink="/payments" 
        routerLinkActive="active"
        (click)="onNavItemClick()">
        <mat-icon matListItemIcon>payment</mat-icon>
        <span matListItemTitle>Pagamentos</span>
      </mat-list-item>

      <h2 matSubheader>Produtos e Serviços</h2>
      <mat-list-item 
        routerLink="/products" 
        routerLinkActive="active"
        (click)="onNavItemClick()">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Produtos</span>
      </mat-list-item>

      <mat-list-item 
        routerLink="/customers" 
        routerLinkActive="active"
        (click)="onNavItemClick()">
        <mat-icon matListItemIcon>business</mat-icon>
        <span matListItemTitle>Clientes</span>
      </mat-list-item>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
