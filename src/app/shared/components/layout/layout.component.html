<mat-toolbar class="app-toolbar">
  <button mat-icon-button (click)="toggleSidenav()" class="sidenav-toggle" aria-label="Menu">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- `inverse`: the toolbar and the default mark's square come from the same token
       (--color-primary-700), so on the toolbar the mark disappears and leaves a loose P. -->
  <div class="brand">
    <app-prumo-mark [size]="30" variant="inverse" label=""></app-prumo-mark>
    <span class="brand__title">Prumo</span>
  </div>

  <span class="spacer"></span>

  <ng-container *ngIf="currentUser$ | async as user">
    <!-- A native button instead of mat-button: mat-button wraps the content in a
         .mdc-button__label the component styles cannot reach, and the avatar, name and
         chevron ended up stacked and overlapping. -->
    <button type="button" [matMenuTriggerFor]="userMenu" class="user-trigger"
            [attr.aria-label]="'Menu for ' + (user.fullName || user.email)">
      <span class="user-trigger__avatar">{{ (user.fullName || user.email)[0] | uppercase }}</span>
      <!-- Only the name here. The e-mail goes down to the menu header: two lines of text
           in a toolbar-height chip get cramped, and the e-mail is long. -->
      <span class="user-trigger__name">{{ user.fullName || user.email }}</span>
      <mat-icon class="user-trigger__chev">expand_more</mat-icon>
    </button>
  </ng-container>

  <mat-menu #userMenu="matMenu" xPosition="before">
    <!-- The e-mail lives here, where there is room for it, instead of squeezed into the chip.
         No `mat-menu-item`: that attribute imposes a clickable item layout (single line,
         fixed height) and glues the e-mail to the name. This is only a header. -->
    <div class="user-menu__header" *ngIf="currentUser$ | async as user">
      <span class="user-menu__name">{{ user.fullName }}</span>
      <span class="user-menu__email">{{ user.email }}</span>
    </div>
    <mat-divider></mat-divider>

    <!-- There is no "Settings" item: it used to be a mat-menu-item with no (click) that
         did nothing, and hiding it beat inventing a screen. -->
    <button mat-menu-item (click)="switchTenant()">
      <mat-icon>swap_horiz</mat-icon>
      <span>Switch tenant</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Sign out</span>
    </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #sidenav
    [opened]="sidenavOpened"
    [mode]="isMobile ? 'over' : 'side'"
    class="app-sidenav"
    (openedChange)="sidenavOpened = $event">
    <mat-nav-list>
      <ng-container *ngIf="currentUser$ | async as currentUser">
        <ng-container *ngFor="let section of menuSections">
          <ng-container *ngIf="hasVisibleItems(section)">
            <h2 matSubheader>{{ section.title }}</h2>

            <ng-container *ngFor="let item of section.items">
              <a
                mat-list-item
                *ngIf="hasAccess(item)"
                [routerLink]="item.route"
                routerLinkActive="active"
                (click)="onNavItemClick()">
                <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
                <span matListItemTitle>{{ item.label }}</span>
              </a>
            </ng-container>
          </ng-container>
        </ng-container>
      </ng-container>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
