<mat-toolbar color="primary" class="app-toolbar">
  <button mat-icon-button (click)="toggleSidenav()" class="sidenav-toggle">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="app-title">BiomePampa ERP</span>
  <span class="spacer"></span>
  <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-menu-btn">
    <mat-icon>person</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu">
    <button mat-menu-item>
      <mat-icon>settings</mat-icon>
      <span>Configurações</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Sair</span>
    </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav 
    #sidenav 
    [opened]="sidenavOpened" 
    [mode]="isMobile ? 'over' : 'side'" 
    class="app-sidenav"
    (openedChange)="sidenavOpened = $event">
    <mat-nav-list>
      <ng-container *ngIf="currentUser$ | async as currentUser">
        <ng-container *ngFor="let section of menuSections">
          <ng-container *ngIf="hasVisibleItems(section, currentUser)">
            <h2 matSubheader>{{ section.title }}</h2>

            <ng-container *ngFor="let item of section.items">
              <mat-list-item
                *ngIf="hasAccess(item.roles, currentUser)"
                [routerLink]="item.route"
                routerLinkActive="active"
                (click)="onNavItemClick()">
                <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
                <span matListItemTitle>{{ item.label }}</span>
              </mat-list-item>
            </ng-container>
          </ng-container>
        </ng-container>
      </ng-container>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
