<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Prumo ERP</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- SVG first: browsers that understand vectors pick it and the mark stays sharp at
       any density. The .ico stays for those that do not. -->
  <link rel="icon" type="image/svg+xml" href="assets/brand/prumo-mark-inverse.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/prumo-mark-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#10314a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- IBM Plex Mono only in weights 400/500: it is used by the .num class, in value,
       date and ID columns. Pulling the whole family would pay for 6 idle weights. -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
